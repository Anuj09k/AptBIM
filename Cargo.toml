[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# GUIDs: the system's random numbers.
getrandom = "0.3"
tempfile = "3"
rayon = "1.12"
aptbim-core = { path = "crates/core" }
aptbim-i18n = { path = "crates/i18n", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
# Deflates PDF streams; png, under tiny-skia, already builds it.
flate2 = "1"
# Reads the JPEGs a texture is made of; the PNGs come in through tiny-skia.
zune-jpeg = "0.5"
# The code pages a DXF's header names: the East Asian ones Latin-1 cannot read.
encoding_rs = "0.8"
aptbim-ui-egui = { path = "crates/ui-egui" }
aptbim-update = { path = "crates/update" }
# The Revit reader: Apache-2.0 only, so the command line and the desktop take it through an optional feature.
aptbim-rvt = { path = "crates/rvt" }
# The DWG bridge: MIT OR Apache-2.0 itself, over acadrust (MPL-2.0, unmodified); the core never depends on it.
aptbim-dwg = { path = "crates/dwg" }
# monochrome_emoji_fonts: egui 0.37 made its emoji font a feature; its own widgets (the colour picker's copy button) draw emoji.
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = "0.37"
egui_kittest = "0.37"
rfd = "0.17"
# The system's language, on Windows and macOS too, where no environment variable says it.
sys-locale = "0.3"
# The updater's: versions, HTTPS (rustls, with ring and the Mozilla roots built in) and SHA-256 (ring's, the one rustls brings).
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
# The Revit reader's: Revit's files are Compound Files (OLE), and a byte search that scans the partitions fast.
cfb = "0.15"
memchr = "2"
# Text notes' fonts: IBM Plex's outlines, its weights too, read from the files the packages carry.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# The 3D view renders in software: build the core optimised in debug builds too, so it orbits smoothly.
[profile.dev.package.aptbim-core]
opt-level = 2

# The Revit reader inflates and scans tens of megabytes per file, which its real-file tests do over and over.
[profile.dev.package.aptbim-rvt]
opt-level = 2
# DWG files are decoded bit by bit.
[profile.dev.package.acadrust]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
[profile.dev.package.cfb]
opt-level = 2

[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
