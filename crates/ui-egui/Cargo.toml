[package]
name = "aptbim-ui-egui"
description = "AptBIM's desktop front end in egui: a thin shell over the core's Session"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs Rust 1.95; the core and the CLI still build with 1.90.
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
aptbim-i18n = { workspace = true }
aptbim-core = { workspace = true }
aptbim-update = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
pollster = "1"
rayon = { workspace = true }
bytemuck = "1"
rfd = { workspace = true }
sys-locale = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
egui_kittest = { workspace = true }
aptbim-update = { workspace = true, features = ["testing"] }

[build-dependencies]
aptbim-i18n = { workspace = true, features = ["catalog"] }
