# Flatpak manifest for the single-file bundle attached to every GitHub release
# (aptbim-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (aptbim-<version>-linux-<arch>.tar.gz, built on
# Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no network and no
# vendored crate sources during the build, a few seconds instead of many minutes, and the same
# binaries as the AppImage, the deb and the rpm. The script unpacks the tarball into `stage/` next
# to a copy of this file. The binaries need glibc 2.35 or later and load X11, Wayland, xkbcommon
# and EGL at run time; the freedesktop runtime has all of them, and the GPU driver comes from its
# org.freedesktop.Platform.GL extension.
id: io.github.anuj09k.aptbim
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: aptbim
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the 3D view (OpenGL).
  - --device=dri
  # Open and Save dialogs go through the file-chooser portal (rfd), so a file picked there is
  # reachable anywhere without broad filesystem access. Documents is granted so a project passed
  # by path (the command line, Open With) works in the usual place.
  - --filesystem=xdg-documents
  # Deliberately not granted: network and the host filesystem.
modules:
  - name: aptbim
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/aptbim /app/bin/aptbim
      - install -Dm755 bin/aptbim-cli /app/bin/aptbim-cli
      - install -Dm644 share/applications/io.github.anuj09k.aptbim.desktop /app/share/applications/io.github.anuj09k.aptbim.desktop
      # .aptbim and .ifc.
      - install -Dm644 share/mime/packages/io.github.anuj09k.aptbim.xml /app/share/mime/packages/io.github.anuj09k.aptbim.xml
      # Already has the release's version and date put in by package.sh.
      - install -Dm644 share/metainfo/io.github.anuj09k.aptbim.metainfo.xml /app/share/metainfo/io.github.anuj09k.aptbim.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/aptbim /app/share/doc/
    sources:
      - type: dir
        path: stage
